name: Validate models and Cloudflare site
on:
  push:
    branches: [main, codex/afl-ml-prediction-model]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r app/requirements-dev.txt
      - run: pytest -q app/tests
      - run: python cloudflare/build.py
      - run: python cloudflare/make_test_cases.py
      - run: node cloudflare/test_runtime.mjs
      # Cloudflare Pages deploys through its Git integration; no Azure login.
